name:  CI avec CodeQL et JaCoCo
on:
  push:
    branches: [ "main"]

jobs:
  analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
         java-version: '21'
         distribution: 'temurin'
         cache: maven

      - name: Initialiser de CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compiler et tester avec Maven
        run: mvn -B clean package
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v7
        with:
         name: rapport-jacoco
         path: target/site/jacoco

      - name: Générer le rapport Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v7
        with:
          name: rapport-checkstyle
          path: |
                target/checkstyle-result.xml
                target/site/checkstyle.html
                target/site/css
                target/site/images

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v4
